<!doctype html>
<html>
  <head>
    <title>Audio Cutter</title>

    <style>
      body {
        font-family: "Inter", sans-serif;
        background: radial-gradient(circle at top, #1e1b4b, #020617);
        color: #e2e8f0;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
      }

      .container {
        background: rgba(15, 23, 42, 0.95);
        padding: 30px;
        border-radius: 18px;
        width: 440px;
        box-shadow: 0 25px 60px rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }

      .home-btn {
        position: absolute;
        top: 15px;
        right: 20px;
        background: #3b82f6;
        padding: 8px 12px;
        border-radius: 6px;
        text-decoration: none;
        color: white;
        font-size: 14px;
      }

      .logout-btn {
        position: fixed;
        bottom: 20px;
        left: 50%;
        transform: translateX(-50%);
        background: #ef4444;
        padding: 10px 16px;
        border-radius: 6px;
        text-decoration: none;
        color: white;
      }

      h1 {
        text-align: center;
        margin-bottom: 20px;
        font-size: 26px;
        color: #c4b5fd;
      }

      input[type="file"] {
        width: 100%;
        padding: 10px;
        background: #020617;
        border: 1px solid #334155;
        border-radius: 10px;
        color: #94a3b8;
        cursor: pointer;
      }

      audio {
        margin-top: 12px;
        width: 100%;
      }

      .file-info {
        font-size: 12px;
        color: #94a3b8;
        margin-top: 8px;
      }

      .slider-group {
        margin-top: 18px;
      }

      .time-box {
        display: flex;
        justify-content: space-between;
        font-size: 13px;
        color: #a5b4fc;
        margin-bottom: 5px;
      }

      input[type="range"] {
        width: 100%;
        accent-color: #8b5cf6;
      }

      .manual-time {
        display: flex;
        gap: 10px;
        margin-top: 10px;
      }

      .manual-time input {
        flex: 1;
        padding: 8px;
        border-radius: 8px;
        border: 1px solid #334155;
        background: #020617;
        color: white;
        font-size: 13px;
      }

      button {
        width: 100%;
        margin-top: 22px;
        padding: 12px;
        border-radius: 12px;
        border: none;
        background: linear-gradient(135deg, #8b5cf6, #6366f1);
        color: white;
        font-weight: 600;
        font-size: 14px;
        cursor: pointer;
      }

      .secondary-btn {
        background: #334155;
        margin-top: 10px;
      }

      .hidden {
        display: none;
      }
    </style>
  </head>

  <body>
    <a href="/home" class="home-btn">🏠 Home</a>

    <div class="container">
      <h1>🎵 Audio Cutter</h1>

      <input type="file" id="audioFile" accept="audio/*" />
      <div id="fileInfo" class="file-info"></div>

      <audio id="player" controls></audio>

      <div id="controls" class="hidden">
        <div class="slider-group">
          <div class="time-box">
            <span>Start</span>
            <span id="startLabel">00:00:00</span>
          </div>
          <input type="range" id="startRange" min="0" value="0" />
        </div>

        <div class="slider-group">
          <div class="time-box">
            <span>End</span>
            <span id="endLabel">00:00:00</span>
          </div>
          <input type="range" id="endRange" min="0" value="0" />
        </div>

        <!-- Manual input -->
        <div class="manual-time">
          <input type="text" id="startManual" placeholder="Start 00:00:00">
          <input type="text" id="endManual" placeholder="End 00:00:00">
        </div>

        <button type="button" onclick="previewSegment()">▶ Preview Selection</button>

        <form
          action="/audio-cutter/cut"
          method="post"
          enctype="multipart/form-data"
        >
          <input type="hidden" name="start" id="startInput" />
          <input type="hidden" name="end" id="endInput" />
          <input type="file" name="audio" id="hiddenFile" class="hidden" />
          <button type="submit">✂️ Cut & Download</button>
        </form>

        <button class="secondary-btn" onclick="resetAll()">Reset</button>
      </div>
    </div>

    <a href="/logout" class="logout-btn">Logout</a>

    <script>
      const fileInput = document.getElementById("audioFile");
      const player = document.getElementById("player");
      const controls = document.getElementById("controls");
      const fileInfo = document.getElementById("fileInfo");

      const startRange = document.getElementById("startRange");
      const endRange = document.getElementById("endRange");

      const startLabel = document.getElementById("startLabel");
      const endLabel = document.getElementById("endLabel");

      const startInput = document.getElementById("startInput");
      const endInput = document.getElementById("endInput");

      const hiddenFile = document.getElementById("hiddenFile");

      const startManual = document.getElementById("startManual");
      const endManual = document.getElementById("endManual");

      fileInput.addEventListener("change", function () {
        const file = this.files[0];
        if (!file) return;

        const url = URL.createObjectURL(file);
        player.src = url;
        player.load();

        hiddenFile.files = this.files;

        fileInfo.innerText = `${file.name} (${(file.size/1024/1024).toFixed(2)} MB)`;

        player.onloadedmetadata = function () {
          const duration = Math.floor(player.duration);

          startRange.max = duration;
          endRange.max = duration;
          endRange.value = duration;

          updateStart();
          updateEnd();

          controls.classList.remove("hidden");
        };
      });

      function formatTime(sec) {
        sec = parseInt(sec);
        let h = Math.floor(sec / 3600);
        let m = Math.floor((sec % 3600) / 60);
        let s = sec % 60;
        return [h, m, s].map((v) => String(v).padStart(2, "0")).join(":");
      }

      function toSec(t){
        let p = t.split(":").map(Number);
        return p[0]*3600 + p[1]*60 + p[2];
      }

      function updateStart() {
        if (parseInt(startRange.value) >= parseInt(endRange.value)) {
          startRange.value = endRange.value - 1;
        }
        const val = formatTime(startRange.value);
        startLabel.innerText = val;
        startInput.value = val;
        startManual.value = val;
      }

      function updateEnd() {
        if (parseInt(endRange.value) <= parseInt(startRange.value)) {
          endRange.value = parseInt(startRange.value) + 1;
        }
        const val = formatTime(endRange.value);
        endLabel.innerText = val;
        endInput.value = val;
        endManual.value = val;
      }

      function previewSegment(){
        try{
          const start = toSec(startManual.value);
          const end = toSec(endManual.value);
          if(end <= start) return;

          player.currentTime = start;
          player.play();

          setTimeout(()=>player.pause(), (end-start)*1000);
        }catch{}
      }

      function resetAll(){
        startRange.value = 0;
        endRange.value = endRange.max;
        updateStart();
        updateEnd();
      }

      startRange.addEventListener("input", updateStart);
      endRange.addEventListener("input", updateEnd);

      startManual.addEventListener("change", ()=>{
        startRange.value = toSec(startManual.value);
        updateStart();
      });

      endManual.addEventListener("change", ()=>{
        endRange.value = toSec(endManual.value);
        updateEnd();
      });
    </script>
  </body>
</html>
