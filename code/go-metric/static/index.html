<!doctype html>
<html>
  <head>
    <title>Production Dashboard</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <style>
      body {
        margin: 0;
        font-family: "Segoe UI";
        background: #0f172a;
        color: white;
        padding: 20px;
      }

      h1 {
        text-align: center;
      }

      .top-box {
        background: linear-gradient(135deg, #22c55e, #16a34a);
        padding: 20px;
        border-radius: 10px;
        text-align: center;
        font-size: 30px;
        margin-bottom: 20px;
      }

      .layout {
        display: grid;
        grid-template-columns: 2fr 1fr;
        gap: 20px;
      }

      .card {
        background: #1e293b;
        padding: 20px;
        border-radius: 10px;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 10px;
        margin-top: 20px;
      }

      .service {
        background: #334155;
        padding: 10px;
        border-radius: 8px;
        text-align: center;
      }

      .count {
        font-size: 22px;
        color: #38bdf8;
      }

      .top-list {
        list-style: none;
        padding: 0;
      }

      .top-list li {
        padding: 8px;
        border-bottom: 1px solid #334155;
      }
    </style>
  </head>

  <body>
    <h1>📊 Microservices Dashboard</h1>

    <div class="top-box" id="total">Total: 0</div>

    <div class="layout">
      <div class="card">
        <h3>Traffic Trend</h3>
        <canvas id="chart"></canvas>
      </div>

      <div class="card">
        <h3>Top Services</h3>
        <ul id="top" class="top-list"></ul>
      </div>
    </div>

    <div class="card">
      <h3>All Services</h3>
      <div id="services" class="grid"></div>
    </div>

    <script>
      let chart;

      const serviceNames = {
        "/audio": "Audio",
        "/music": "Music",
        "/pdf": "PDF",
        "/word_to_pdf": "Word→PDF",
        "/youtube": "YouTube",
        "/shortener": "Shortener",
        "/todo": "Todo",
        "/audio-combiner": "Audio Merge",
        "/audio-cutter": "Audio Cutter",
        "/cidr": "CIDR",
        "/home": "Home",
      };

      async function load() {
        const res = await fetch("/api/stats");
        const data = await res.json();

        document.getElementById("total").innerText =
          "Total Hits: " + data.total;

        const servicesDiv = document.getElementById("services");
        servicesDiv.innerHTML = "";

        for (const route in serviceNames) {
          const count = data.routes[route] || 0;

          servicesDiv.innerHTML += `
            <div class="service">
              <div>${serviceNames[route]}</div>
              <div class="count">${count}</div>
            </div>
          `;
        }

        const topList = document.getElementById("top");
        topList.innerHTML = "";
        data.top.slice(0, 5).forEach((item) => {
          topList.innerHTML += `<li>${item.Key} — ${item.Value}</li>`;
        });

        if (!chart) {
          const ctx = document.getElementById("chart");
          chart = new Chart(ctx, {
            type: "line",
            data: {
              labels: data.timeline.map((_, i) => i),
              datasets: [
                {
                  label: "Hits / interval",
                  data: data.timeline,
                  borderWidth: 2,
                  tension: 0.3,
                },
              ],
            },
          });
        } else {
          chart.data.labels = data.timeline.map((_, i) => i);
          chart.data.datasets[0].data = data.timeline;
          chart.update();
        }
      }

      // run ONLY once after 3 seconds
      setTimeout(load, 2000);
    </script>
  </body>
</html>
