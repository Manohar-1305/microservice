apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-microservice
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"

spec:
  project: default

  source:
    repoURL: https://github.com/Manohar-1305/microservice.git
    targetRevision: main
    path: helm/user-service
    helm:
      valueFiles:
        - values.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: microservices

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
