name: Build and Push User Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'code/user_service/**'

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code/user_service

    steps:
    - uses: actions/checkout@v4

    - name: Login to DockerHub
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

    - name: Build Image
      run: docker build -t manoharsetty507/user-service:latest .

    - name: Push Image
      run: docker push manoharsetty507/user-service:latest
