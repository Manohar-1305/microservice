apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: audio-service
  template:
    metadata:
      labels:
        app: audio-service
    spec:
      containers:
        - name: audio-service
          image: manoharshetty507/audio-converter-service:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 5003
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-creds
                  key: RABBITMQ_URL
---
apiVersion: v1
kind: Service
metadata:
  name: audio-converter-service
  namespace: microservices
spec:
  selector:
    app: audio-service
  ports:
    - port: 5003
      targetPort: 5003

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: audio-worker
  namespace: microservices
spec:
  replicas: 2
  selector:
    matchLabels:
      app: audio-worker
  template:
    metadata:
      labels:
        app: audio-worker
    spec:
      containers:
        - name: audio-worker
          image: manoharshetty507/audio-worker:latest
          imagePullPolicy: Always
          env:
            - name: RABBITMQ_URL
              valueFrom:
                secretKeyRef:
                  name: rabbitmq-creds
                  key: RABBITMQ_URL
---
apiVersion: v1
kind: Secret
metadata:
  name: rabbitmq-creds
  namespace: microservices
type: Opaque
stringData:
  RABBITMQ_URL: "amqp://admin:changeme-strong-password@rabbitmq.messaging.svc.cluster.local:5672/"
