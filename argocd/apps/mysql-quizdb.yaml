apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: user-db
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:
  project: default

  source:
    repoURL: https://github.com/Manohar-1305/microservice.git
    targetRevision: main
    path: k8s-manifest

  destination:
    server: https://kubernetes.default.svc
    namespace: microservices

  syncPolicy:
    automated:
      prune: true
      selfHeal: true