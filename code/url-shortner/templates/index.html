<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>URL Shortener</title>

<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: Inter, Arial, sans-serif;
  background: linear-gradient(135deg, #020617, #0f172a, #1e293b);
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
}

/* container */
.container {
  width: 400px;
  padding: 25px;
  border-radius: 16px;
  background: #1e293b;
  color: white;
  box-shadow: 0 15px 40px rgba(0,0,0,0.6);
  text-align: center;
}

/* title */
h1 {
  margin-bottom: 8px;
  font-size: 22px;
}

.sub {
  font-size: 13px;
  color: #94a3b8;
  margin-bottom: 20px;
}

/* input */
.input-group {
  position: relative;
  width: 100%;
}

.input-group i {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  color: #94a3b8;
}

input {
  width: 100%;
  padding: 12px 12px 12px 35px;
  border-radius: 8px;
  border: 1px solid #334155;
  background: #020617;
  color: white;
}

/* button */
button {
  width: 100%;
  padding: 12px;
  margin-top: 12px;
  border-radius: 8px;
  border: none;
  background: linear-gradient(135deg,#3b82f6,#2563eb);
  color: white;
  font-weight: bold;
  cursor: pointer;
}

button:hover {
  opacity: 0.9;
}

/* result */
.result {
  margin-top: 15px;
  text-align: left;
}

.hidden {
  display: none;
}

.ok {
  background: #022c22;
  border: 1px solid #22c55e;
  padding: 12px;
  border-radius: 10px;
}

/* link row */
.link-row {
  display: flex;
  gap: 6px;
  align-items: center;
  margin-bottom: 8px;
}

.link-row a {
  flex: 1;
  font-size: 12px;
  color: #38bdf8;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.copy-btn {
  padding: 6px 8px;
  background: #3b82f6;
  border: none;
  border-radius: 6px;
  color: white;
  cursor: pointer;
}

/* QR */
.qr {
  display: flex;
  justify-content: center;
  margin-top: 10px;
}

.qr img {
  width: 90px;
}

/* text */
.muted {
  font-size: 11px;
  color: #94a3b8;
}

/* nav */
.home-btn {
  position: absolute;
  top: 20px;
  right: 20px;
  background: #22c55e;
  padding: 6px 10px;
  border-radius: 6px;
  color: white;
  text-decoration: none;
}

.logout-btn {
  position: fixed;
  bottom: 20px;
  left: 50%;
  transform: translateX(-50%);
  background: #ef4444;
  padding: 8px 16px;
  border-radius: 8px;
  color: white;
  text-decoration: none;
}
</style>
</head>

<body>

<a href="/home" class="home-btn"><i class="fa fa-home"></i></a>

<div class="container">
  <h1><i class="fa fa-link"></i> URL Shortener</h1>
  <p class="sub">Paste a long URL and get a short one.</p>

  <form id="form">
    <div class="input-group">
      <i class="fa fa-globe"></i>
      <input id="long_url" type="text" placeholder="https://example.com/..." required />
    </div>

    <button type="submit">
      <i class="fa fa-bolt"></i> Shorten
    </button>
  </form>

  <div id="result" class="result hidden"></div>
</div>

<a href="/logout" class="logout-btn">Logout</a>

<script>
const form = document.getElementById("form");
const result = document.getElementById("result");

form.addEventListener("submit", async (e) => {
  e.preventDefault();

  result.classList.add("hidden");
  result.innerHTML = "";

  const long_url = document.getElementById("long_url").value.trim();

  const res = await fetch("/api/shorten", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({ long_url })
  });

  const data = await res.json();

  if (!res.ok) {
    result.classList.remove("hidden");
    result.innerHTML = `<div class="ok">Error</div>`;
    return;
  }

  const shortUrl = data.short_url;

  result.classList.remove("hidden");
  result.innerHTML = `
    <div class="ok">
      <div class="link-row">
        <a id="shortLink" href="${shortUrl}" target="_blank">${shortUrl}</a>
        <button class="copy-btn" onclick="copyLink(this)">
          <i class="fa fa-copy"></i>
        </button>
      </div>

      <div class="muted">Code: ${data.code}</div>
      <div class="muted">Long: ${data.long_url}</div>

      <div class="qr">
        <img src="https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${shortUrl}">
      </div>
    </div>
  `;
});

function copyLink(btn) {
  const link = document.getElementById("shortLink").href;

  const temp = document.createElement("input");
  temp.value = link;
  document.body.appendChild(temp);
  temp.select();
  document.execCommand("copy");
  document.body.removeChild(temp);

  btn.innerHTML = "✔";
  setTimeout(() => {
    btn.innerHTML = '<i class="fa fa-copy"></i>';
  }, 1200);
}
</script>

</body>
</html>
