{% extends "base.html" %} {% block title %}Edit Task{% endblock %} {% block
content %}
<div class="edit-head">
  <h2>Edit Task</h2>
  <a class="btn" href="{{ url_for('index', date=selected_date) }}">Back</a>
</div>

<form
  class="edit"
  method="POST"
  action="{{ url_for('edit_save', task_id=task.id) }}"
>
  <input name="title" type="text" value="{{ task.title }}" required />
  <input type="hidden" name="selected_date" value="{{ selected_date }}" />
  <button type="submit">Save</button>
</form>
{% endblock %}
