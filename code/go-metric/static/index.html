<!doctype html>
<html>
<head>
  <title>Microservices Dashboard</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    body {
      margin: 0;
      font-family: "Segoe UI";
      background: linear-gradient(135deg, #1a0000, #000000);
      color: white;
      padding: 20px;
    }

    /* TOP BAR */
    .top-bar {
      position: relative;
      margin-bottom: 25px;
    }

    .main-title {
      text-align: center;
      margin: 0;
      font-size: 32px;
    }

    .home-btn {
      position: absolute;
      right: 0;
      top: 0;
      background: linear-gradient(135deg, #22c55e, #16a34a);
      padding: 10px 18px;
      border-radius: 8px;
      color: white;
      text-decoration: none;
      font-weight: bold;
      transition: 0.2s;
    }

    .home-btn:hover {
      transform: scale(1.05);
    }

    .top-box {
      background: linear-gradient(135deg, #ff0000, #b30000);
      padding: 25px;
      border-radius: 14px;
      text-align: center;
      font-size: 34px;
      font-weight: bold;
      margin-bottom: 25px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .layout {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 20px;
    }

    .card {
      background: linear-gradient(145deg, #1a0000, #000000);
      padding: 20px;
      border-radius: 14px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.6);
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
      gap: 15px;
      margin-top: 20px;
    }

    .service {
      background: linear-gradient(135deg, #ff0000, #800000);
      padding: 15px;
      border-radius: 10px;
      text-align: center;
      transition: 0.2s;
      cursor: pointer;
    }

    .service:hover {
      transform: scale(1.05);
    }

    .count {
      font-size: 26px;
      font-weight: bold;
      margin-top: 5px;
    }

    .top-list {
      list-style: none;
      padding: 0;
    }

    .top-list li {
      padding: 10px;
      border-radius: 6px;
      margin-bottom: 8px;
      background: linear-gradient(90deg, #ff0000, #ff4d4d);
    }

    canvas {
      background: #000000;
      border-radius: 10px;
      padding: 10px;
    }
  </style>
</head>

<body>

  <!-- TOP BAR -->
  <div class="top-bar">
    <h1 class="main-title">📊 Microservices Dashboard</h1>
    <a href="/home" class="home-btn">🏠 Home</a>
  </div>

  <div class="top-box" id="total">Total: 0</div>

  <div class="layout">
    <div class="card">
      <h3>📈 Traffic Trend</h3>
      <canvas id="chart"></canvas>
    </div>

    <div class="card">
      <h3>🔥 Top Services</h3>
      <ul id="top" class="top-list"></ul>
    </div>
  </div>

  <div class="card">
    <h3>🧩 All Services</h3>
    <div id="services" class="grid"></div>
  </div>

  <script>
    let chart;

    const serviceNames = {
      "/audio": "Audio",
      "/music": "Music",
      "/pdf": "PDF",
      "/word_to_pdf": "Word→PDF",
      "/youtube": "YouTube",
      "/shortener": "Shortener",
      "/todo": "Todo",
      "/audio-combiner": "Audio Merge",
      "/audio-cutter": "Audio Cutter",
      "/cidr": "CIDR",
      "/home": "Home",
    };

    async function load() {
      const res = await fetch("/api/stats");
      const data = await res.json();

      document.getElementById("total").innerText =
        "Total Hits: " + data.total;

      const servicesDiv = document.getElementById("services");
      servicesDiv.innerHTML = "";

      for (const route in serviceNames) {
        const count = data.routes[route] || 0;

        servicesDiv.innerHTML += `
          <div class="service">
            <div>${serviceNames[route]}</div>
            <div class="count">${count}</div>
          </div>
        `;
      }

      const topList = document.getElementById("top");
      topList.innerHTML = "";
      data.top.slice(0, 5).forEach((item) => {
        topList.innerHTML += `<li>${item.Key} — ${item.Value}</li>`;
      });

      if (!chart) {
        const ctx = document.getElementById("chart");
        chart = new Chart(ctx, {
          type: "line",
          data: {
            labels: data.timeline.map((_, i) => i),
            datasets: [{
              label: "Hits",
              data: data.timeline,
              borderColor: "#22c55e",
              backgroundColor: "rgba(34,197,94,0.2)",
              fill: true,
              tension: 0.4
            }]
          }
        });
      } else {
        chart.data.labels = data.timeline.map((_, i) => i);
        chart.data.datasets[0].data = data.timeline;
        chart.update();
      }
    }

    setTimeout(load, 2000);
  </script>

</body>
</html>
