apiVersion: apps/v1
kind: Deployment
metadata:
  name: cidr-service
  namespace: microservices
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cidr-service
  template:
    metadata:
      labels:
        app: cidr-service
    spec:
      containers:
      - name: cidr-service
        image: manoharshetty507/cidr-service:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5008
---
apiVersion: v1
kind: Service
metadata:
  name: cidr-service
  namespace: microservices
spec:
  selector:
    app: cidr-service
  ports:
    - protocol: TCP
      port: 5008
      targetPort: 5008
  type: ClusterIP
