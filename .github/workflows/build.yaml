name: Build User Microservice Service

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'code/user_service/**'

env:
  IMAGE_NAME: user-service
  DOCKER_USERNAME: manoharshetty507
  VIRTUAL_ENV: .venv

jobs:
  build:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: code/user_service

    steps:
    - uses: actions/checkout@v4

    - name: Install test deps
      run: pip install pytest flask mysql-connector-python

    - name: Run tests
      run: pytest

    - name: Login
      run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u $DOCKER_USERNAME --password-stdin

    - name: Build
      run: docker build -t $DOCKER_USERNAME/$IMAGE_NAME:latest .

    - name: Push
      run: docker push $DOCKER_USERNAME/$IMAGE_NAME:latest
